<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Star Restaurant & Accomodation</title>
  <meta name="description" content="City Star Restaurant & Accomodation - Luxury Suites, Fine Dining & Poolside Lounge">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandRed: '#DC2626',      /* Vibrant Primary Red */
            brandRedLight: '#EF4444', /* Bright Red Accent */
            brandRedDark: '#991B1B',  /* Deep Red */
            brandMaroon: '#6B0012',   /* Royal Maroon */
            brandMaroonDark: '#3F000A',/* Dark Obsidian Maroon */
            brandGray900: '#0F172A',  /* Main Deep Slate/Gray Background */
            brandGray800: '#1E293B',  /* Card Charcoal Gray */
            brandGray700: '#334155',  /* Panel Border Gray */
            brandGray600: '#475569',  /* Subtitle Muted Gray */
            brandGray200: '#E2E8F0',  /* Light Gray Text/Border */
            brandGray100: '#F8FAFC',  /* Off-White Text */
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Cinzel, Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brandGray900 text-brandGray100 font-sans antialiased selection:bg-brandRed selection:text-white min-h-screen">

  <!-- Top Global Header: Official City Star Emblem Logo Top-Left -->
  <header id="main-header" class="sticky top-0 z-50 bg-brandMaroonDark/95 backdrop-blur-xl border-b border-brandRed/30 px-5 lg:px-10 py-3 flex items-center justify-between shadow-2xl">
    <!-- Brand Logo & Name Top-Left -->
    <div class="flex items-center gap-3.5 cursor-pointer" onclick="appStore.switchMode('mobile')">
      <div id="brand-logo-container" class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center p-1 border border-brandRed/40 shadow-lg shadow-brandRed/40 overflow-hidden flex-shrink-0">
        <img id="brand-logo-img" src="assets/logo.png" alt="City Star Logo" class="w-full h-full object-contain">
      </div>
      <div>
        <span class="font-serif font-bold tracking-widest text-lg sm:text-xl text-white uppercase block leading-tight">City Star</span>
        <p class="text-[9px] sm:text-[10px] text-brandRedLight font-bold tracking-[0.25em] uppercase mt-0.5">Restaurant & Accomodation</p>
      </div>
    </div>

    <!-- Mode Switcher Navigation -->
    <nav class="flex items-center gap-1.5 sm:gap-2 bg-brandGray800/90 p-2 rounded-2xl border border-brandGray700 shadow-inner overflow-x-auto">
      <button id="btn-mode-mobile" onclick="appStore.switchMode('mobile')" class="nav-mode-btn active flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold tracking-wide transition-all whitespace-nowrap">
        <i data-lucide="smartphone" class="w-4 h-4"></i>
        <span>Guest Mobile App</span>
      </button>

      <button id="btn-mode-hotel" onclick="appStore.switchMode('hotel')" class="nav-mode-btn flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold tracking-wide transition-all whitespace-nowrap">
        <i data-lucide="hotel" class="w-4 h-4"></i>
        <span>Front Desk</span>
      </button>

      <button id="btn-mode-kitchen" onclick="appStore.switchMode('kitchen')" class="nav-mode-btn flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold tracking-wide transition-all whitespace-nowrap">
        <i data-lucide="utensils-crossed" class="w-4 h-4"></i>
        <span>Kitchen KDS</span>
      </button>

      <button id="btn-mode-scanner" onclick="appStore.switchMode('scanner')" class="nav-mode-btn flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold tracking-wide transition-all whitespace-nowrap">
        <i data-lucide="waves" class="w-4 h-4"></i>
        <span>Poolside Scanner</span>
      </button>

      <button id="btn-mode-admin" onclick="appStore.switchMode('admin')" class="nav-mode-btn flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold tracking-wide transition-all whitespace-nowrap">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        <span>Super Admin</span>
      </button>
    </nav>

    <!-- Header Quick Actions -->
    <div class="hidden xl:flex items-center gap-4 text-xs font-medium">
      <div class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white/5 border border-white/10 text-brandGray200">
        <span class="w-2 h-2 rounded-full bg-brandRedLight animate-pulse"></span>
        <span class="tracking-wider uppercase text-[10px] font-bold">System Active</span>
      </div>
      <button onclick="appStore.resetDemoData()" class="p-2.5 rounded-xl bg-brandGray800 text-brandGray200 hover:text-white border border-brandGray700 transition-all" title="Reset Demo Data">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm pointer-events-none"></div>

  <!-- Main Content View Area -->
  <main id="app-container" class="min-h-[calc(100vh-69px)] relative overflow-hidden bg-brandGray900">
    <!-- Rendered dynamically by JS -->
  </main>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/mobileViews.js"></script>
  <script src="js/dashboards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
