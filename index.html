<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Star Maiduguri - Luxury Hotel & Resort</title>
  <meta name="description" content="City Star Maiduguri 5-Star Luxury Resort App & Operational Dashboards">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Strict Color Palette: Red, Maroon, and Gray
            brandRed: '#DC2626',      /* Vibrant Primary Red */
            brandRedLight: '#EF4444', /* Bright Red Accent */
            brandRedDark: '#991B1B',  /* Deep Red */
            brandMaroon: '#6B0012',   /* Royal Maroon */
            brandMaroonDark: '#3F000A',/* Dark Obsidian Maroon */
            brandGray900: '#111827',  /* Main Deep Gray Background */
            brandGray800: '#1F2937',  /* Card Charcoal Gray */
            brandGray700: '#374151',  /* Panel Border Gray */
            brandGray600: '#4B5563',  /* Subtitle Muted Gray */
            brandGray200: '#E5E7EB',  /* Light Gray Text/Border */
            brandGray100: '#F9FAFB',  /* Off-White Text */
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brandGray900 text-brandGray100 font-sans antialiased selection:bg-brandRed selection:text-white min-h-screen">

  <!-- Top Global Header Rule: Brand Logo Top-Left -->
  <header id="main-header" class="sticky top-0 z-50 bg-brandMaroonDark/95 backdrop-blur-xl border-b border-brandRed/30 px-4 lg:px-8 py-3 flex items-center justify-between shadow-2xl">
    <!-- Brand Logo Top-Left -->
    <div class="flex items-center gap-3 cursor-pointer" onclick="appStore.switchMode('mobile')">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brandRed to-brandMaroon flex items-center justify-center shadow-lg shadow-brandRed/40 border border-white/20">
        <i data-lucide="crown" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-outfit font-extrabold tracking-wider text-base sm:text-lg text-white uppercase">City Star</span>
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-brandRed/20 border border-brandRed/40 text-brandRedLight uppercase tracking-widest">Maiduguri</span>
        </div>
        <p class="text-[9px] sm:text-[10px] text-brandGray200 font-medium tracking-widest uppercase">Luxury Hotel & Resort</p>
      </div>
    </div>

    <!-- Mode Switcher Navigation -->
    <nav class="flex items-center gap-1 sm:gap-2 bg-brandGray800/90 p-1.5 rounded-2xl border border-brandGray700 shadow-inner overflow-x-auto">
      <button id="btn-mode-mobile" onclick="appStore.switchMode('mobile')" class="nav-mode-btn active flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
        <i data-lucide="smartphone" class="w-4 h-4"></i>
        <span>Guest Mobile App</span>
      </button>

      <button id="btn-mode-hotel" onclick="appStore.switchMode('hotel')" class="nav-mode-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
        <i data-lucide="hotel" class="w-4 h-4"></i>
        <span>Front Desk</span>
      </button>

      <button id="btn-mode-kitchen" onclick="appStore.switchMode('kitchen')" class="nav-mode-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
        <i data-lucide="utensils-crossed" class="w-4 h-4"></i>
        <span>Kitchen KDS</span>
      </button>

      <button id="btn-mode-scanner" onclick="appStore.switchMode('scanner')" class="nav-mode-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
        <i data-lucide="qr-code" class="w-4 h-4"></i>
        <span>Wellness Scanner</span>
      </button>

      <button id="btn-mode-admin" onclick="appStore.switchMode('admin')" class="nav-mode-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        <span>Super Admin</span>
      </button>
    </nav>

    <!-- Header Quick Actions -->
    <div class="hidden xl:flex items-center gap-4 text-xs font-medium">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-brandGray200">
        <span class="w-2 h-2 rounded-full bg-brandRedLight animate-pulse"></span>
        <span>Live System Active</span>
      </div>
      <button onclick="appStore.resetDemoData()" class="p-2 rounded-lg bg-brandGray800 text-brandGray200 hover:text-white border border-brandGray700" title="Reset Demo Data">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm pointer-events-none"></div>

  <!-- Main Content View Area -->
  <main id="app-container" class="min-h-[calc(100vh-65px)] relative overflow-hidden bg-brandGray900">
    <!-- Rendered dynamically by JS -->
  </main>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/mobileViews.js"></script>
  <script src="js/dashboards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
