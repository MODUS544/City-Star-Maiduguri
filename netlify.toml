# Netlify Configuration for City Star Maiduguri Luxury Hospitality App

[build]
  publish = "."

# SPA Redirect Rule to ensure smooth client-side routing on Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Luxury App
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
